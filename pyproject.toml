[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frankensettings"
version = "0.1.0"
description = "Keep one settings.json in sync between a public template and a private live file: merge, pull back, and scrub local paths."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "non7top" }]
keywords = ["settings", "json", "dotfiles", "config", "merge", "sync", "claude-code", "vscode", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=6.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/non7top/frankensettings"
Source = "https://github.com/non7top/frankensettings"
Issues = "https://github.com/non7top/frankensettings/issues"
Changelog = "https://github.com/non7top/frankensettings/blob/master/CHANGELOG.md"

[project.scripts]
fsettings = "frankensettings.cli:main"

[tool.setuptools]
packages = ["frankensettings"]

[tool.setuptools.package-data]
frankensettings = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["frankensettings"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
